<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launchpad Workshop Test</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5f0;
      color: #222;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .card {
      max-width: 700px;
      background: white;
      padding: 50px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 42px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .status {
      margin-top: 30px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main>
    <div class="card">
      <h1>Launchpad Workshop Test</h1>

      <p>
        This website was deployed using GitHub as part of the
        Your Launchpad Partner website workshop deployment test.
      </p>

      <p class="status">
        If you can see this page online, the deployment workflow works. 🎉
      </p>
    </div>
  </main>
</body>
</html>
